repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.69
    hooks:
      - id: ty

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: "1.2.0"
    hooks:
      - id: pyrefly-check
        additional_dependencies: ["duckdb>=1.5.5", "typer>=0.27.1", "pytest>=9.1.1"]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
