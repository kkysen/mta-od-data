# `pre-commit install` sets up both, for `pytest-full` before each push.
default_install_hook_types: [pre-commit, pre-push]
# And every hook runs on commit, but `pytest-full`, which says otherwise.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Every Python tool runs from the project's own environment,
      # at the version `uv.lock` pins, rather than from a copy pinned here:
      # two pins for one tool drift apart, and a hook and CI then disagree.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]

      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      # Split so that commits on agent worktrees can run
      # `SKIP=pytest-e2e git commit` and still run every cheap test.
      - id: pytest
        name: pytest
        entry: uv run pytest -m "not e2e"
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-e2e
        name: pytest (e2e)
        entry: uv run pytest -m "e2e and not full"
        language: system
        pass_filenames: false
        always_run: true

      # The reports that route, over all their dates, five times the routing
      # of the one month `pytest-e2e` checks them for: before each push instead.
      - id: pytest-full
        name: pytest (full reports)
        entry: uv run pytest -m full
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        files: (\.rs|Cargo\.(toml|lock))$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: (\.rs|Cargo\.(toml|lock))$
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        files: (\.rs|Cargo\.(toml|lock))$
        pass_filenames: false
