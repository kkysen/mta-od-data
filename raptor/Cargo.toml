[package]
name = "raptor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
jiff = "0.2.37"
json5 = "1.3.1"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
