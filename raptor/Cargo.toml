[package]
name = "raptor"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
csv = "1.4.0"
dhat = { version = "0.3.3", optional = true }
jiff = "0.2.38"
json5 = "1.3.4"
mimalloc = "0.1.52"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
pyo3 = { version = "0.30.1", features = ["anyhow", "jiff-02"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
zip = { version = "9.1.1", default-features = false, features = ["deflate"] }

[build-dependencies]
pyo3-build-config = "0.30.1"

[features]
# Heap profiling: `dhat`'s allocator in place of `mimalloc`,
# writing `dhat-heap.json` for each date assigned (see `scripts/profile-heap.sh`).
dhat-heap = ["dep:dhat"]
