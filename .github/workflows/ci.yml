name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  OD_RELEASE_TAG: od-data

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      # The OD Parquet is too big to check in, so it lives as a release asset (see `README.md`).
      # Without it the analyze tests skip themselves,
      # so a missing or not-yet-published release leaves CI green but thinner.
      - name: download the OD dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OD_RELEASE_TAG" \
            --pattern mta_od.parquet --dir data --clobber \
          || echo "no $OD_RELEASE_TAG release asset; analyze tests will skip"

      - name: pytest
        run: uv run pytest
