name: Station data freshness

# The station reference CSVs are checked in, so they go stale silently
# when the MTA edits a station upstream. Refetch them on a schedule
# and open a PR with the fresh data, rather than failing every PR's
# CI on an unrelated upstream edit (or on `data.ny.gov` being down).
on:
  schedule:
    # Mondays at 12:00 UTC.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: refetch station reference data
        run: uv run mta-od-data prepare --stations-only

      - name: diff against what's checked in
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "station reference data is up to date"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/
          fi

      # Not `continue-on-error`, since the PR body reports the outcome:
      # drift that breaks the analyses is exactly what needs a human.
      - name: run the tests against the fresh data
        if: steps.diff.outputs.stale == 'true'
        id: tests
        continue-on-error: true
        run: uv run pytest

      - name: open a PR
        if: steps.diff.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          branch="station-data/refresh"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          # A single reused branch, force-pushed: successive weeks of drift
          # belong in one open PR, not one PR per week.
          git switch -c "$branch"
          git commit -m "refresh the station reference data" -- data/
          git push --force origin "$branch"

          body="$(printf '%s\n\n%s\n\n```\n%s\n```\n' \
            "\`data.ny.gov\` has edited the station reference data since it was checked in." \
            "\`pytest\` against the fresh data: **$TESTS**." \
            "$(git diff --stat HEAD~1 -- data/)")"
          existing="$(gh pr list --head "$branch" --state open \
            --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "Refresh the station reference data" --body "$body"
          fi
