[project]
name = "mta-od-data"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "json5>=0.17.3",
    "openpyxl>=3.1.5",
    "osmium>=4.3.2",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[project.scripts]
mta-od-data = "mta_od_data.cli:app"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

# The `raptor` crate, built as the `mta_od_data._raptor` extension module.
[tool.maturin]
manifest-path = "raptor/Cargo.toml"
python-source = "src"
module-name = "mta_od_data._raptor"
bindings = "pyo3"
# Routing a date takes minutes unoptimized, even for an editable install.
profile = "release"

# Rebuild the extension when the crate changes, not just `pyproject.toml`.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "raptor/Cargo.toml" },
    { file = "raptor/Cargo.lock" },
    { file = "raptor/src/**/*.rs" },
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyrefly]
preset = "strict"

[tool.ty.rules]
blanket-ignore-comment = "warn"
division-by-zero = "warn"
missing-override-decorator = "warn"
missing-type-argument = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"
