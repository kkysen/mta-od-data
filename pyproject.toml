[project]
name = "mta-od-data"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "duckdb>=2.0.0",
    "json5>=0.17.3",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "osmium>=4.3.2",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "scipy>=1.18.1",
    "shapely>=2",
    "typer>=0.27.3",
]

[project.scripts]
mta-od-data = "mta_od_data.cli:app"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

# The `raptor` crate, built as the `mta_od_data._raptor` extension module.
[tool.maturin]
manifest-path = "raptor/Cargo.toml"
python-source = "src"
module-name = "mta_od_data._raptor"
bindings = "pyo3"
# Routing a date takes minutes unoptimized, even for an editable install.
profile = "release"

# Rebuild the extension when the crate changes, not just `pyproject.toml`.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "raptor/Cargo.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "raptor/src/**/*.rs" },
    { file = "raptor/build.rs" },
    # Built into the extension, by `include_str!`
    # (`tests/test_cache_keys.py` checks every such file is here).
    { file = "raptor/passages.json5" },
    { file = "raptor/lidar_walks.csv" },
    { file = "raptor/osm_walks.csv" },
    { file = "raptor/lidar_access.csv" },
    { file = "streets/Cargo.toml" },
    { file = "streets/src/**/*.rs" },
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that run reports through the CLI, can route, and take very long",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyrefly]
preset = "strict"

[tool.ty.rules]
blanket-ignore-comment = "warn"
division-by-zero = "warn"
missing-override-decorator = "warn"
missing-type-argument = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"
